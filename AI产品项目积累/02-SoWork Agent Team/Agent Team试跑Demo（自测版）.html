      {id:"T3",phase:3,name:"产品定位与 MVP 决策",owner:owner("product",1),deps:"T2 用户研究摘要",workAt:2,doneAt:3,artifact:"产品决策稿 v2",acceptance:"定位、场景与能力边界一致",parallel:true},
      {id:"T4",phase:3,name:"商业模式与定价验证",owner:owner("commercial",2),deps:"T2 用户研究摘要",workAt:2,doneAt:3,artifact:"定价实验表 v2",acceptance:"定价与 MVP 边界一致",parallel:true},

    ];
  }

  function runtimeTaskStatus(task){
    if(state.runPhase==="completed"||state.stage>=task.doneAt)return "done";
    if(state.runPhase==="cancelled")return "cancelled";
    if(["partial","failed","expired"].includes(state.runPhase)||state.serviceState==="failed")return "failed";
    if(state.stage===task.workAt)return "working";
    return "wait";
  }

  function statusLabel(status){
    return {done:"✓ 已完成",working:"◔ 执行中",wait:"等待",off:"本次未参与",cancelled:"已取消",failed:"异常中止"}[status]||"等待";
  }

  function taskStatus(index){
    const item=state.runIds[index];
    if(!item)return "wait";
    const statuses=runtimeTasks().filter(task=>task.owner===item).map(runtimeTaskStatus);
    if(!statuses.length)return "off";
    if(statuses.includes("working"))return "working";
    if(statuses.length&&statuses.every(status=>status==="done"))return "done";
    if(statuses.includes("cancelled"))return "cancelled";
    if(statuses.includes("failed"))return "failed";
    return "wait";
  }

  function renderSnapshotPerson(id,title,role,status){
    const item=id==="leader"?null:ex(id);
    const face=id==="leader"?`<span class="leader-dot">L</span>`:avatar(item,"sm");
    const content=`${face}<span><b>${safe(title)}</b><small>${safe(role)}</small></span><span class="member-state ${status}">${statusLabel(status)}</span>`;
    return item&&status!=="off"?`<button class="snapshot-person" data-member="${id}">${content}</button>`:`<div class="snapshot-person">${content}</div>`;
  }

  function renderRunPanel(){
    const tasks=runtimeTasks();
    const doneCount=tasks.filter(task=>runtimeTaskStatus(task)==="done").length;
    const activeTask=tasks.find(task=>runtimeTaskStatus(task)==="working")||tasks.find(task=>runtimeTaskStatus(task)==="wait")||tasks[tasks.length-1];
    const terminal=["completed","cancelled","partial","failed","expired"].includes(state.runPhase);
    const currentTitle=state.runPhase==="completed"?"任务已完成并通过验收":state.runPhase==="cancelled"?"任务已取消":state.runPhase==="partial"?"部分成功：已保留可用产物":state.runPhase==="failed"?"任务失败：未达到最低成功条件":state.runPhase==="expired"?"任务已过期：停止继续执行":state.serviceState==="retrying"?"服务暂不可用，正在恢复任务":`正在${activeTask?activeTask.name:"推进任务"}`;
    const currentDetail=state.runPhase==="completed"?"6 个任务均已完成，最终方案与验收报告可查看":state.runPhase==="cancelled"?"已停止新任务分派；晚到的外部结果不会改写当前状态":state.runPhase==="partial"?"无法恢复的任务已停止，已完成产物仍然可用":state.runPhase==="failed"?"关键依赖无法恢复；已完成的检查点和产物仍可查看":state.runPhase==="expired"?"任务超过有效期；现有产物已冻结，不再消耗执行机会":activeTask?`负责人：${activeTask.owner==="leader"?"Leader":ex(activeTask.owner)?.name||"专业成员"} · 依赖：${activeTask.deps}`:"等待下一步";
    const pulseClass=state.runPhase==="completed"?"pulse done":terminal?"pulse stopped":"pulse";
    const pulseText=state.runPhase==="completed"?"✓":terminal?"!":"";
    const lastPhase=state.runPhase==="completed"?4:Math.max(1,Math.min(4,state.stage+1));
    const artifacts=doneCount;
    const needsUser=terminal&&state.runPhase!=="completed"?1:0;
    const alerts=[
      state.restored?`<div class="run-alert restored"><span>↺</span><span><b>已从服务端恢复运行快照</b>阶段、成员、产物和待办均已恢复，本次没有重复执行。</span><button data-dismiss-restored aria-label="关闭">×</button></div>`:"",
      state.serviceState==="retrying"?`<div class="run-alert retrying"><span>◔</span><span><b>服务暂时不可用，正在重试</b>保留最后一次有效状态，不会重复分派已经完成的任务。</span></div>`:"",
      state.runPhase==="partial"?`<div class="run-alert failed"><span>!</span><span><b>服务确定无法恢复，本次以部分成功结束</b>已完成产物继续可用；未完成任务已标记异常，不会伪装为成功。</span></div>`:"",
      state.runPhase==="failed"?`<div class="run-alert failed"><span>!</span><span><b>关键依赖失败，本次任务未达到最低成功条件</b>失败模块、最后错误和仍可用产物已记录在结果详情中。</span></div>`:"",
      state.runPhase==="expired"?`<div class="run-alert retrying"><span>⌛</span><span><b>任务已超过有效期</b>系统已停止继续分派；过期前通过验收的产物仍可查看。</span></div>`:"",
      state.runPhase==="cancelled"?`<div class="run-alert cancelled"><span>×</span><span><b>任务已取消</b>系统已停止新任务分派；无法撤回的外部调用返回后将被隔离，不会把任务重新显示为成功。</span></div>`:""
    ].join("");
    const professionalIds=state.runIds.filter(id=>id!=="qa");
    const offExpert=experts.find(item=>!state.runIds.includes(item.id)&&item.id!=="qa");
    const leaderState=state.runPhase==="completed"?"done":state.runPhase==="cancelled"?"cancelled":["partial","failed","expired"].includes(state.runPhase)?"failed":"working";
    const qaTask=tasks.find(task=>task.owner==="qa");
    const teamHtml=[renderSnapshotPerson("leader","Leader","规划、调度与统一交付 · 只读",leaderState),...professionalIds.map(id=>renderSnapshotPerson(id,ex(id).name,roleNames[id]||"专业成员",taskStatus(state.runIds.indexOf(id)))),renderSnapshotPerson("qa","Verifier","独立验收与定向返工 · 只读",runtimeTaskStatus(qaTask)),offExpert?renderSnapshotPerson(offExpert.id,offExpert.name,"规划阶段候选 · 未进入本次执行","off"):""].join("");
    const phases={1:"规划与确认",2:"用户与市场研究",3:"专业方案并行",4:"独立验收与交付"};

    const canRetry=state.stage>=3&&state.attemptsUsed<6&&state.runPhase==="executing"&&state.serviceState==="ok";
    const retryCopy=state.stage>=3?`变化点：仅修订“定价假设与 MVP 能力冲突”，未重跑已通过的用户研究。最后结果：${state.attemptsUsed>=2?"已对齐能力边界，等待 Verifier 复验":"等待返工"}。`:"当前尚未触发返工；验收失败时只重做问题模块。";
    const expanded=state.taskListOpen?`<section class="inline-run-detail"><div class="run-summary"><div><strong>${lastPhase}/4</strong><span>当前阶段</span></div><div><strong>${doneCount}/${tasks.length}</strong><span>已完成任务</span></div><div><strong>${artifacts}</strong><span>可用阶段产物</span></div><div><strong>${needsUser}</strong><span>待用户介入</span></div></div><section class="inline-section"><div class="inline-section-head"><h3>团队区域</h3><p>本次运行快照</p><span class="grow"></span>${!terminal?`<button class="mini-action" data-service-demo>异常演示</button><button class="mini-action danger" data-cancel-run>取消任务</button>`:""}</div><div class="snapshot-grid">${teamHtml}</div></section><section class="inline-section"><div class="inline-section-head"><h3>任务区域</h3><p>按阶段展示依赖、产物与验收</p></div>${taskHtml}</section><section class="inline-section"><div class="inline-section-head"><h3>重试与返工</h3><p>当前验收目标：定价与 MVP 边界一致</p></div><div class="rework-card"><div><h4>已使用 <strong>${state.attemptsUsed}/6</strong> 次执行机会</h4><p>${retryCopy}${state.attemptsUsed>=6?" 已达上限，不再提供继续重试。":""}</p></div>${canRetry?`<button class="btn outline" data-retry-task>定向重试</button>`:""}</div></section><section class="inline-section"><div class="privacy-note"><span>◉</span><span>仅展示计划、任务状态、工具动作、产物、验收与异常；不展示隐藏思维链、内部 Prompt、凭证或无关技术日志。</span></div></section><footer class="inline-footer"><span>离开页面后，可从左侧任务记录恢复当前快照，不会重复执行。</span><span class="grow"></span>${state.runPhase==="completed"?`<button class="btn dark" data-next>存为专家团</button>`:state.runPhase==="executing"?`<button class="btn dark" data-next ${state.serviceState!=="ok"?"disabled":""}>推进演示 →</button>`:`<span>任务终态已冻结</span>`}</footer></section>`:"";
    return `<section class="inline-run">${alerts}<button class="inline-run-toggle ${state.taskListOpen?"open":""}" data-toggle-task-list><span>▧</span><b>任务列表</b><small>${doneCount}/${tasks.length} 已完成 · ${state.taskListOpen?"收起详情":"展开详情"}</small><i>⌄</i></button><button class="current-work" data-toggle-task-list><span class="${pulseClass}">${pulseText}</span><span><b>${safe(currentTitle)}</b><small>${safe(currentDetail)}</small></span><i>›</i></button><div class="current-meta"><b>阶段 ${lastPhase}/4</b><span class="meta-dot">${doneCount} 个任务已完成</span><span class="meta-dot">${artifacts} 个产物可用</span><span class="meta-dot">执行机会 ${state.attemptsUsed}/6</span></div>${expanded}</section>`;
  }

  function isTerminalPhase(){
    return ["completed","partial","failed","cancelled","expired"].includes(state.runPhase);
  }

  function resultTaskContext(){
    const tasks=runtimeTasks();
    const done=tasks.filter(task=>runtimeTaskStatus(task)==="done");
    const incomplete=tasks.filter(task=>runtimeTaskStatus(task)!=="done");
    return {tasks,done,incomplete,first:incomplete[0]||null};
  }

  function currentOwnedTeam(){
    const selected=state.selectedTeam?tm(state.selectedTeam):null;
    return state.myTeams.find(team=>team.id===state.selectedTeam||(selected&&team.name===selected.name))||null;
  }

  function visibleMemoryChanges(){
    if(state.runPhase==="completed")return state.memoryChanges;
    if(state.runPhase!=="partial")return [];
    return state.memoryChanges.filter(item=>item.id==="memory-1"?state.stage>=2:state.stage>=3);
  }

  function syncConfirmedMemoryToOwnedTeam(){
    const team=currentOwnedTeam();
    if(!team)return null;
    const confirmed=state.memoryChanges.filter(item=>item.status==="confirmed").map(item=>item.text);
    team.memory=[...new Set([...(team.memory||[]),...confirmed])];
    return team;
  }

  function resultOutcome(){
    const context=resultTaskContext();
    const firstName=context.first?.name||"未完成模块";
    const outcomes={
      completed:{tone:"success",label:"成功",icon:"✓",title:"上市方案已完成并通过验收",reason:"6 项任务全部完成，最终方案通过 Verifier 的完整性与一致性检查。",next:"下一步：用 8–10 名目标用户验证价格敏感度。"},
      partial:{tone:"partial",label:"部分成功",icon:"!",title:"已保留可用产物，任务未完成全部验收",reason:`异常发生前已有 ${context.done.length} 项产物通过阶段验收，另有 ${context.incomplete.length} 项未完成。`,next:`下一步：从“${firstName}”继续完成缺口。`},
      failed:{tone:"failed",label:"失败",icon:"×",title:"任务未达到最低成功条件",reason:`任务在“${firstName}”处遇到不可恢复错误，后续结论无法形成可信交付。`,next:`下一步：修复该模块依赖后，仅重新执行未完成任务。`},
      cancelled:{tone:"cancelled",label:"已取消",icon:"×",title:"任务已按用户确认取消",reason:"系统已经停止新任务分派，取消前通过验收的产物仍然保留。",next:"下一步：可查看已有产物或复制任务后重新开始。"},
      expired:{tone:"expired",label:"已过期",icon:"⌛",title:"任务超过有效期，已停止继续执行",reason:`运行窗口结束时仍有 ${context.incomplete.length} 项任务未完成，现有检查点和已验收产物已冻结。`,next:`下一步：延长有效期后从“${firstName}”续建任务。`}
    };
    return outcomes[state.runPhase]||outcomes.completed;
  }

  function renderResultSummary(){
    if(!isTerminalPhase())return "";
    const outcome=resultOutcome();
    return `<section class="result-summary-card ${outcome.tone}"><span class="result-symbol">${outcome.icon}</span><span class="result-summary-copy"><b>${safe(outcome.label)} · ${safe(outcome.title)}</b><small>${safe(outcome.reason)} ${safe(outcome.next)}</small></span><button class="btn outline" data-result-detail>查看结果详情 →</button></section>`;
  }

  function resultGapData(){
    const context=resultTaskContext();
    const modules=context.incomplete.length?context.incomplete.map(task=>task.name).join("、"):"无失败模块";
    const firstName=context.first?.name||"未完成模块";
    const data={
      completed:{module:"无失败模块",error:"无阻断错误；定价与 MVP 冲突已在第 2 次执行机会修复",recommendation:"继续开展真实用户价格敏感度验证"},
      partial:{module:modules,error:`“${firstName}”执行服务连续重试后仍不可用`,recommendation:`保留现有产物，从“${firstName}”续建任务`},
      failed:{module:modules,error:`“${firstName}”所需的关键输入或外部依赖不可用`,recommendation:"修复依赖后，只重跑未完成模块"},
      cancelled:{module:"取消时尚未完成的任务",error:`用户在阶段 ${Math.max(1,Math.min(4,state.stage+1))}/4 确认取消`,recommendation:"查看取消前产物，或复制本次目标重新发起"},
      expired:{module:modules,error:`任务在“${firstName}”完成前超过有效期`,recommendation:"延长有效期后从最近检查点恢复"}
    };
    return data[state.runPhase]||data.completed;
  }

    const memoryHtml=showMemory?memoryCandidates.map(item=>`<div class="memory-change"><span><b>${safe(item.text)}<span class="inferred-chip">模型推断项</span></b><small>依据：${safe(item.reason)}</small></span>${item.status==="pending"?`<span class="memory-decision"><button data-memory-decision="ignored" data-memory-id="${item.id}">忽略</button><button class="primary" data-memory-decision="confirmed" data-memory-id="${item.id}">确认</button></span>`:`<span class="memory-status ${item.status}">${item.status==="confirmed"?confirmedLabel:"已忽略"}</span>`}</div>`).join(""):`<div class="empty-memory">本次任务尚未形成经过有效阶段验收的团队经验，因此没有长期记忆变化。</div>`;
    const availableNames=availableTasks.length?availableTasks.map(task=>task.artifact).join("、"):"暂无可用产物";
    const issueLabel=["cancelled","expired"].includes(state.runPhase)?"终止原因":"最后错误";
    $("#overlay").innerHTML=`<div class="drawer-bg"><aside class="drawer result-sheet ${outcome.tone}"><div class="result-sheet-scroll"><header class="result-sheet-head"><span class="result-symbol">${outcome.icon}</span><div><h2>结果详情</h2><p>任务终态、交付物可信度、结果缺口与记忆变化</p></div><span class="result-state-chip ${outcome.tone}">${safe(outcome.label)}</span></header><section class="result-outcome"><b>${safe(outcome.title)}</b><span>${safe(outcome.reason)}</span><span>${safe(outcome.next)}</span></section><section class="result-detail-section"><div class="result-detail-title"><h3>交付物与可信度</h3><p>${availableTasks.length}/${tasks.length} 项可用</p></div><div class="deliverable-list">${deliverables}</div></section><section class="result-detail-section"><div class="result-detail-title"><h3>结果缺口</h3><p>说明当前可用边界与后续动作</p></div><div class="gap-grid"><div class="gap-fact"><span>失败或未完成模块</span><b>${safe(gap.module)}</b></div><div class="gap-fact"><span>${issueLabel}</span><b>${safe(gap.error)}</b></div><div class="gap-fact"><span>已用执行机会</span><b>${state.attemptsUsed}/6 次</b></div><div class="gap-fact"><span>建议下一步</span><b>${safe(gap.recommendation)}</b></div></div><div class="usable-products"><b>当前仍可使用的产物</b><p>${safe(availableNames)}</p></div></section><section class="result-detail-section"><div class="result-detail-title"><h3>团队记忆变化</h3><p>${showMemory?`${pending.length} 项待确认 · 未确认前不生效`:"本次无变更"}</p><span class="grow"></span><button class="mini-action" data-view-team-memory>查看团队记忆</button></div><div class="memory-change-list">${memoryHtml}</div></section></div><footer class="result-sheet-actions"><button class="btn soft" data-close>返回对话</button><span>交付物限制和推断项均已显式标注</span><span class="grow"></span>${showMemory&&pending.length?`<button class="btn dark" data-confirm-all-memory>确认全部记忆变化</button>`:""}</footer></aside></div>`;
  }

  function memoryOverviewDialog(){
    const selected=state.selectedTeam?tm(state.selectedTeam):null;
    const owned=currentOwnedTeam();
    const base=[...((owned||selected)?.memory||[])];
    const confirmed=state.memoryChanges.filter(item=>item.status==="confirmed").map(item=>item.text);

  function validateInput(goal){
    const badFile=state.files.find(file=>!file.readable);
    if(!goal)state.inputError="请填写明确的任务目标；已选择的专家、附件和工作空间都会保留。";
    else if(badFile)state.inputError=`附件“${badFile.name}”无法读取，请移除后重新上传可用文件。`;
    else if(!state.hasProjectPermission)state.inputError=`你暂无“${state.workspaceName}”的访问权限，请切换有权限的项目或联系管理员。`;
    else state.inputError="";
    if(state.inputError){render();return false}
    return true;
  }

  function openTask(record){
    if(!record)return;
    state.currentTaskId=record.id;state.task=record.task;state.selectedTeam=record.selectedTeam;state.runIds=[...record.runIds];
    state.stage=record.stage??state.stage;state.approval=record.approval||state.approval;state.attemptsUsed=record.attemptsUsed||1;state.serviceState=record.serviceState||"ok";state.memoryChanges=(record.memoryChanges||memoryChangeTemplate).map(item=>({...item}));state.taskListOpen=false;state.restored=!['planning','proposal'].includes(record.status);
    if(record.status==="planning"){state.runPhase="planning";state.view="planning"}else{state.runPhase=record.status;state.view="run"}
    $("#overlay").innerHTML="";render();
  }

  function startTeamPlanning(goal){
    const selected=state.attachedType==="team"?tm(state.attachedId):null;
    const selectedTeam=selected?.id||null;
    const runIds=selected?[...new Set([...selected.ids,"qa"])]:[...defaultRunIds];
    const key=[goal,selectedTeam||"auto",state.workspaceName,state.files.map(file=>file.name).join(",")].join("|");
    const existing=state.taskRecords.find(record=>record.key===key&&!["failed","cancelled","expired"].includes(record.status));
    if(existing){openTask(existing);toast("该任务已提交，已返回现有任务记录");return}
    if(state.submitLock){toast("任务已提交，正在规划团队");return}
    state.submitLock=true;state.task=goal;state.selectedTeam=selectedTeam;state.runIds=runIds;state.runPhase="planning";state.stage=0;state.taskListOpen=false;state.serviceState="ok";state.restored=false;state.attemptsUsed=1;state.memoryChanges=memoryChangeTemplate.map(item=>({...item}));
    const record={id:"task-"+Date.now(),key,title:goal.slice(0,18)+(goal.length>18?"…":""),task:goal,status:"planning",stage:0,approval:state.approval,attemptsUsed:1,serviceState:"ok",memoryChanges:state.memoryChanges.map(item=>({...item})),selectedTeam,runIds:[...runIds]};
    state.taskRecords.unshift(record);state.currentTaskId=record.id;state.attachedType=null;state.attachedId=null;state.view="planning";render();
    setTimeout(()=>{const current=state.taskRecords.find(item=>item.id===record.id);if(!current||current.status!=="planning")return;current.status="proposal";state.submitLock=false;if(state.currentTaskId===record.id){state.runPhase="proposal";if(state.view==="planning"){state.view="run";render()}else updateShell()}},2200);
  }

    const title=adjust?"调整本次专业成员":editing?"管理专家团成员":"新建我的专家团";
    const action=adjust?"应用到本次团队":editing?"保存成员变更":"▣ 保存专家团";
    $("#overlay").innerHTML=`<div class="backdrop"><section class="modal builder"><button class="close" data-close>×</button><header class="builder-head"><span class="eyebrow">${adjust?"ADJUST THIS RUN":editing?"EDIT LONG-TERM TEAM":"BUILD YOUR TEAM"}</span><h2>${title}</h2><p>${adjust?"本次可从平台专家池临时借调；任务结束后不会自动写入长期团队。":"长期团队只能从“我的专家”中选择专业成员。Leader与Verifier由系统确定并保持只读。"}</p></header><div class="builder-body"><div class="picker"><div class="picker-top"><div class="search">⌕　${adjust?"平台专家池":"我的专家"} · ${pool.length} 位可选</div><button class="btn soft" data-recommend>✦ 智能推荐</button></div><div class="picker-grid">${pool.map(pickerCard).join("")}</div></div><aside class="draft"><h3>团队预览　<small>${state.selected.length}/6 位专业成员</small></h3><input id="team-name" value="${safe(state.draftTeamName)}" ${editing?"disabled":""}><div class="leader-note"><span class="leader-dot">L</span><p><b>Leader + Verifier 只读</b><small>总角色上限8个，因此最多选择6位专业成员</small></p></div><div class="selected-list">${state.selected.length?state.selected.map(id=>`<div class="selected-person">${avatar(ex(id),"sm")}<span><b>${safe(ex(id).name)}</b><small>${safe(roleNames[id]||"专业成员")}</small></span></div>`).join(""):`<p style="text-align:center;color:#aaa;font-size:10px;line-height:1.7">选择至少1位专业成员<br>或使用智能推荐快速组队</p>`}</div><button class="btn dark save-btn" data-save-team ${state.selected.length<1?"disabled":""}>${action}</button></aside></div></section></div>`;
  }

  function memberDrawer(item){
    const index=state.runIds.indexOf(item.id),status=index>=0?taskStatus(index):"done";
    const memberText=status==="done"?"✓ 已完成工作":status==="working"?"◔ 正在工作":status==="cancelled"?"× 任务已取消":status==="failed"?"! 异常中止":"等待前置任务";
    $("#overlay").innerHTML=`<div class="drawer-bg"><aside class="drawer"><div class="drawer-top"><button class="btn soft" data-close>← 返回主会话</button><span style="color:${status==="cancelled"||status==="failed"?"#a84c3c":"var(--green)"};font-size:10px">${memberText}</span></div><div class="drawer-person">${avatar(item)}<div><h2>${safe(item.name)}</h2><small>${safe(item.nick)} · 工具调用 ${status==="done"?4:2} 次</small></div></div><section class="assignment"><span>🟠　Leader 分配的工作</span><p>${safe(item.assign)}</p></section><div class="route"><span>① 接收任务</span><span>──</span><span>② 调用工具</span><span>──</span><span>③ 回传Leader</span></div><section class="output"><div class="speaker">${avatar(item,"sm")}<div><b>${safe(item.name)}</b><small>工作成果概述</small></div></div><p>${safe(item.summary)}</p><div class="file-card"><span>📄</span><div><b>专业分析原文</b><small>${status==="done"?"1,842 字 · 已交付":status==="cancelled"?"已取消 · 不再写入":status==="failed"?"保留最后检查点":"正在生成 · 已保存检查点"}</small></div></div><div class="file-card"><span>✦</span><div><b>关键结论摘要</b><small>3条建议 · 2项风险</small></div></div></section><div class="communication">♙　<b>协作路径：成员 → Leader</b><br>成员不直接互相通信。这里展示的是任务、工具动作、产物和异常，不展示隐藏推理。</div></aside></div>`;
  }

  function syncCurrentRecord(patch){
    const record=state.taskRecords.find(item=>item.id===state.currentTaskId);
    if(record)Object.assign(record,patch);
  }

  function cancelRunDialog(){
    $("#overlay").innerHTML=`<div class="backdrop"><section class="modal quick"><button class="close" data-close>×</button><span class="eyebrow">CANCEL TASK</span><h2>确认取消这次团队任务？</h2><p>确认后将停止新任务分派。已经无法撤回的外部调用即使稍后返回，也不会把已取消任务重新显示为成功。</p><div class="modal-actions"><button class="btn soft" data-close>继续执行</button><button class="btn dark" data-confirm-cancel>确认取消</button></div></section></div>`;
  }

  function serviceDemoDialog(){
    $("#overlay").innerHTML=`<div class="backdrop"><section class="modal quick"><button class="close" data-close>×</button><span class="eyebrow">RUNTIME EXCEPTION DEMO</span><h2>演示任务异常与结果终态</h2><p>这些选项只改变演示状态，不会清空已经完成并验收通过的阶段。</p><div class="new-options"><button class="new-option" data-service-state="retrying"><span>◔</span><b>服务暂时不可用</b><small>保留最后有效状态并显示正在重试</small></button><button class="new-option" data-service-state="ok"><span>↺</span><b>服务恢复</b><small>从当前检查点继续，不重复执行</small></button><button class="new-option" data-service-state="partial"><span>◐</span><b>部分成功</b><small>无法继续，但已有可用产物通过验收</small></button><button class="new-option" data-service-state="failed"><span>!</span><b>任务失败</b><small>关键依赖失败，未达到最低成功条件</small></button><button class="new-option" data-service-state="expired"><span>⌛</span><b>任务已过期</b><small>超过有效执行窗口，冻结已有产物</small></button></div></section></div>`;
  }

  function saveRuntime(){
    const name="我的AI硬件上市团队";
    const confirmed=state.memoryChanges.filter(item=>item.status==="confirmed").map(item=>item.text);
    let team=state.myTeams.find(item=>item.name===name);
    if(!team){
      team={id:"saved-"+Date.now(),name,owner:"由本次任务保存",cat:"产品设计",desc:"曾协同完成AI硬件新品上市方案，保留已确认的分工方式与团队记忆。",ids:[...state.runIds],tags:["新品上市","已协作","长期记忆"],version:"v1.1",uses:1,memory:[...confirmed],changeLog:[`由任务保存；写入 ${confirmed.length} 条已确认记忆`]};
      state.myTeams.push(team);
    }else{
      team.memory=[...new Set([...(team.memory||[]),...confirmed])];
      team.uses=(team.uses||0)+1;team.version=bumpVersion(team.version);team.changeLog=[...(team.changeLog||[]),`复用任务完成；新增 ${confirmed.length} 条已确认记忆`];
    }
    state.selectedTeam=team.id;
    toast(`已保存到“我的专家团”${confirmed.length?`，同步 ${confirmed.length} 条已确认记忆`:"；未确认记忆不会写入"}`);
  }

  document.addEventListener("click",event=>{
    const button=event.target.closest("button"); if(!button)return;
    if("close" in button.dataset){$("#overlay").innerHTML="";return}
    if("resultDetail" in button.dataset){resultDetailsDrawer();return}
    if(button.dataset.memoryDecision){
      const item=state.memoryChanges.find(change=>change.id===button.dataset.memoryId);
      if(item){item.status=button.dataset.memoryDecision;syncConfirmedMemoryToOwnedTeam();syncCurrentRecord({memoryChanges:state.memoryChanges.map(change=>({...change}))})}
      resultDetailsDrawer();
      toast(button.dataset.memoryDecision==="confirmed"?(currentOwnedTeam()?"该条记忆已确认并写入当前团队":"该条记忆已确认，保存团队后生效"):"该条候选记忆已忽略");
      return;
    }
    if("confirmAllMemory" in button.dataset){
      visibleMemoryChanges().forEach(item=>{if(item.status==="pending")item.status="confirmed"});
      syncConfirmedMemoryToOwnedTeam();
      syncCurrentRecord({memoryChanges:state.memoryChanges.map(item=>({...item}))});
      resultDetailsDrawer();toast(currentOwnedTeam()?"全部候选经验已确认并写入当前团队":"全部候选经验已确认，保存团队后生效");return;
    }
    if("viewTeamMemory" in button.dataset){memoryOverviewDialog();return}
    if("toggleTaskList" in button.dataset){state.taskListOpen=!state.taskListOpen;render();return}
    if("dismissRestored" in button.dataset){state.restored=false;render();return}
    if("cancelRun" in button.dataset){cancelRunDialog();return}
    if("confirmCancel" in button.dataset){state.runPhase="cancelled";state.serviceState="ok";state.taskListOpen=true;syncCurrentRecord({status:"cancelled",stage:state.stage,attemptsUsed:state.attemptsUsed,serviceState:"ok",memoryChanges:state.memoryChanges.map(item=>({...item}))});$("#overlay").innerHTML="";render();toast("任务已取消，已完成产物仍然保留");return}
    if("serviceDemo" in button.dataset){serviceDemoDialog();return}
    if(button.dataset.serviceState){
      const next=button.dataset.serviceState;$("#overlay").innerHTML="";
      if(["partial","failed","expired"].includes(next)){
        state.runPhase=next;state.serviceState=next==="expired"?"expired":"failed";state.taskListOpen=true;
        syncCurrentRecord({status:next,stage:state.stage,attemptsUsed:state.attemptsUsed,serviceState:state.serviceState,memoryChanges:state.memoryChanges.map(item=>({...item}))});
        render();
        toast(next==="partial"?"无法恢复，任务已按部分成功收口":next==="failed"?"关键依赖失败，任务已进入失败终态":"任务已过期，现有产物已冻结","warning");
      }else{
        state.serviceState=next;state.runPhase="executing";state.restored=next==="ok";
        syncCurrentRecord({status:"executing",stage:state.stage,attemptsUsed:state.attemptsUsed,serviceState:next,memoryChanges:state.memoryChanges.map(item=>({...item}))});
        render();toast(next==="retrying"?"已保留最后有效状态，正在重试":"已从当前检查点恢复，没有重复执行",next==="retrying"?"warning":"success");
      }
      return;
    }
    if("retryTask" in button.dataset){if(state.attemptsUsed>=6||state.runPhase!=="executing")return;state.attemptsUsed=Math.min(6,state.attemptsUsed+1);syncCurrentRecord({attemptsUsed:state.attemptsUsed,stage:state.stage});render();toast(state.attemptsUsed>=6?"已达到6次执行机会，不再继续重试":"已发起定向重试，只处理验收未通过的变化点",state.attemptsUsed>=6?"warning":"success");return}
    if("artifact" in button.dataset){resultDetailsDrawer();return}
    if(button.dataset.mode){const nextMode=button.dataset.mode;if((state.attachedType==="team"&&nextMode==="normal")||(state.attachedType==="expert"&&nextMode==="team")){state.attachedType=null;state.attachedId=null;toast("切换工作模式后，已移除不匹配的召唤对象")}state.mode=nextMode;render();return}
    if(button.dataset.openTask){openTask(state.taskRecords.find(record=>record.id===button.dataset.openTask));return}
    if(button.dataset.view){state.view=button.dataset.view;$("#overlay").innerHTML="";render();return}
    if("newMenu" in button.dataset){newMenu();return}
    if("openFileMenu" in button.dataset){fileMenu();return}
    if("openWorkspaceMenu" in button.dataset){workspaceMenu();return}
    if(button.dataset.addFile){const readable=button.dataset.addFile==="readable",name=readable?"产品需求说明.pdf":"损坏的调研附件.zip";if(!state.files.some(file=>file.name===name))state.files.push({id:"file-"+Date.now(),name,readable});state.inputError="";$("#overlay").innerHTML="";render();toast(readable?"附件已添加":"已添加不可读附件，可点击发送体验异常提示",readable?"success":"warning");return}
    if(button.dataset.removeFile){state.files=state.files.filter(file=>file.id!==button.dataset.removeFile);state.inputError="";render();toast("附件已移除");return}
    if(button.dataset.selectWorkspace){const allowed=button.dataset.selectWorkspace==="allowed";state.workspaceName=allowed?"新品项目":"受限项目";state.hasProjectPermission=allowed;state.inputError="";$("#overlay").innerHTML="";render();toast(allowed?"已切换到有权限的项目":"已切换到受限项目，可点击发送体验权限提示");return}
    if(button.dataset.openPlaza){const input=$("#task-input");if(input)state.task=input.value;state.plazaTab=button.dataset.openPlaza;state.plazaCat="全部";state.view="plaza";render();return}
    if(button.dataset.plazaTab){state.plazaTab=button.dataset.plazaTab;state.plazaCat="全部";render();return}
    if(button.dataset.myTab){state.myTab=button.dataset.myTab;render();return}
    if(button.dataset.cat){state.plazaCat=button.dataset.cat;render();return}
    if("searchGo" in button.dataset){state.plazaSearch=$("#plaza-search")?.value||"";render();return}
    if("start" in button.dataset){const input=$("#task-input"),goal=(input?input.value:state.task).trim();state.task=input?input.value:state.task;if(!validateInput(goal))return;if(state.attachedType==="team"||state.mode==="team"){startTeamPlanning(goal);return}if(state.attachedType==="expert"){state.currentExpert=state.attachedId;state.mode="normal";state.view="single"}else{state.currentExpert=null;state.view="single"}state.attachedType=null;state.attachedId=null;render();return}
    if("exampleTeam" in button.dataset){state.task="为一款AI录音耳机制定完整的新品上市方案，包含用户洞察、产品定位、商业化、发布页面和质量审核。";state.mode="team";state.selectedTeam=null;if(validateInput(state.task))startTeamPlanning(state.task);return}
    if("switchTeamRun" in button.dataset){state.mode="team";state.selectedTeam=null;if(validateInput(state.task.trim()))startTeamPlanning(state.task.trim());return}
    if(button.dataset.summonTeam){const input=$("#task-input");if(input)state.task=input.value;const team=tm(button.dataset.summonTeam);state.attachedType="team";state.attachedId=team.id;state.mode="team";state.view="home";$("#overlay").innerHTML="";render();toast(`已召唤「${team.name}」，输入工作内容后再发送`);return}
    if(button.dataset.summonExpert){if(state.mode==="team"){toast("单个专家仅支持普通模式，请切换模式或选择专家团","warning");return}const input=$("#task-input");if(input)state.task=input.value;const item=ex(button.dataset.summonExpert);state.attachedType="expert";state.attachedId=item.id;state.mode="normal";state.view="home";$("#overlay").innerHTML="";render();toast(`已召唤「${item.name}」，输入工作内容后再发送`);return}
    if(button.dataset.teamDetail){const team=tm(button.dataset.teamDetail);$("#overlay").innerHTML="";teamDetail(team);return}
    if(button.dataset.expertDetail){const item=ex(button.dataset.expertDetail);$("#overlay").innerHTML="";expertDetail(item);return}
    if(button.dataset.collectTeam){const team=tm(button.dataset.collectTeam);if(!state.myTeams.some(item=>item.name===team.name))state.myTeams.push({...team,id:"mine-"+Date.now(),owner:"我的副本",ids:[...team.ids],tags:[...(team.tags||[])],memory:[...(team.memory||[])]});$("#overlay").innerHTML="";toast("已生成可维护的个人团队副本");return}
    if(button.dataset.addExpert){if(!state.myExpertIds.includes(button.dataset.addExpert))state.myExpertIds.push(button.dataset.addExpert);$("#overlay").innerHTML="";updateShell();toast("已加入“我的专家”");return}
    if("quickTeamStart" in button.dataset){state.task=$("#quick-task")?.value.trim()||state.task;const team=tm(state.quickTeam);state.selectedTeam=team.id;state.runIds=[...new Set([...team.ids,"qa"])];state.mode="team";state.runPhase="proposal";state.stage=0;state.taskListOpen=false;state.serviceState="ok";state.restored=false;state.attemptsUsed=1;state.memoryChanges=memoryChangeTemplate.map(item=>({...item}));state.view="run";$("#overlay").innerHTML="";render();return}
    if("quickExpertStart" in button.dataset){state.task=$("#quick-task")?.value.trim()||state.task;state.currentExpert=state.quickExpert;state.mode="normal";state.view="single";$("#overlay").innerHTML="";render();return}
    if(button.dataset.approval){state.approval=button.dataset.approval;render();return}
    if("confirmTeam" in button.dataset){state.runPhase="executing";state.stage=1;state.runTab="overview";state.taskListOpen=false;state.serviceState="ok";state.restored=false;state.attemptsUsed=1;state.memoryChanges=memoryChangeTemplate.map(item=>({...item}));syncCurrentRecord({status:"executing",stage:1,approval:state.approval,attemptsUsed:1,serviceState:"ok",memoryChanges:state.memoryChanges.map(item=>({...item}))});render();return}
    if(button.dataset.runTab){state.runTab=button.dataset.runTab;render();return}
    if(button.dataset.builder){$("#overlay").innerHTML="";builder(button.dataset.builder);return}
    if(button.dataset.editTeamMembers){$("#overlay").innerHTML="";builder("editTeam",button.dataset.editTeamMembers);return}
    if(button.dataset.removeTeamMember){const team=state.myTeams.find(item=>item.id===button.dataset.teamId);if(!team){toast("官方团队需先加入‘我的专家’后才能编辑");return}const professionals=team.ids.filter(id=>id!=="qa");if(professionals.length<=1){toast("长期团队至少保留1位专业成员");return}team.ids=team.ids.filter(id=>id!==button.dataset.removeTeamMember);team.version=bumpVersion(team.version);team.changeLog=[...(team.changeLog||[]),`删除成员：${ex(button.dataset.removeTeamMember)?.name||button.dataset.removeTeamMember}`];teamDetail(team);toast("成员已删除，团队版本已更新");return}
    if(button.dataset.memoryAction){const labels={edit:"记忆编辑入口已展示",history:"已打开记忆版本历史",delete:"删除长期记忆前需要二次确认"};toast(labels[button.dataset.memoryAction]||"团队记忆已更新");return}
    if("removeAttachment" in button.dataset){state.attachedType=null;state.attachedId=null;render();toast("已从当前对话移除");return}
    if(button.dataset.fillTeamPrompt){const team=tm(button.dataset.fillTeamPrompt);state.task=`帮我把一个${team?.cat||"复杂"}方向拆成目标、专业工作包、验收标准和最终交付。`;state.attachedType="team";state.attachedId=team.id;state.mode="team";$("#overlay").innerHTML="";state.view="home";render();toast("专家团和示例任务已加入对话框");return}
    if(button.dataset.pick){if(state.selected.includes(button.dataset.pick))state.selected=state.selected.filter(id=>id!==button.dataset.pick);else if(state.selected.length<6)state.selected.push(button.dataset.pick);else{toast("团队总上限8个角色，最多选择6位专业成员");return}drawBuilder();return}
    if("recommend" in button.dataset){const available=state.builderMode==="adjust"?defaultRunIds.filter(id=>id!=="qa"):defaultRunIds.filter(id=>id!=="qa"&&state.myExpertIds.includes(id));state.selected=available.slice(0,6);drawBuilder();return}
    if("saveTeam" in button.dataset){if(state.builderMode==="adjust"){state.runIds=[...state.selected,"qa"];state.selectedTeam=null;$("#overlay").innerHTML="";render();toast("本次团队成员已调整")}else if(state.builderMode==="editTeam"){const team=state.myTeams.find(item=>item.id===state.editTeamId);if(!team)return;team.ids=[...state.selected];team.version=bumpVersion(team.version);team.changeLog=[...(team.changeLog||[]),"更新专业成员配置"];$("#overlay").innerHTML="";teamDetail(team);toast("成员变更已保存，可在历史版本中查看")}else{state.myTeams.push({id:"custom-"+Date.now(),name:state.draftTeamName||"我的专家团",owner:"我创建的",cat:"产品设计",desc:"由你选择专业成员组成的长期团队，Leader会依据任务动态分工。",ids:[...state.selected],tags:["自定义团队","动态分工","长期记忆"],version:"v1.0",uses:0,memory:["暂无已确认记忆，完成任务后可开始积累"],changeLog:["创建长期团队"]});$("#overlay").innerHTML="";state.myTab="teams";state.view="my";render();toast("专家团已创建")}return}
    if(button.dataset.member){memberDrawer(ex(button.dataset.member));return}
    if("next" in button.dataset){if(state.runPhase==="completed"){saveRuntime();return}if(state.runPhase!=="executing"||state.serviceState!=="ok")return;state.stage++;if(state.stage>=3)state.attemptsUsed=Math.max(2,state.attemptsUsed);if(state.stage>=4){state.stage=4;state.runPhase="completed";syncCurrentRecord({status:"completed",stage:4,attemptsUsed:state.attemptsUsed,serviceState:"ok",memoryChanges:state.memoryChanges.map(item=>({...item}))})}else syncCurrentRecord({status:"executing",stage:state.stage,attemptsUsed:state.attemptsUsed,serviceState:"ok",memoryChanges:state.memoryChanges.map(item=>({...item}))});render();return}
    if("saveRuntime" in button.dataset){saveRuntime();return}
    if("saveLearning" in button.dataset){visibleMemoryChanges().forEach(item=>{if(item.status==="pending")item.status="confirmed"});syncConfirmedMemoryToOwnedTeam();syncCurrentRecord({memoryChanges:state.memoryChanges.map(item=>({...item}))});toast(currentOwnedTeam()?"已确认经验并写入当前团队":"已确认经验，保存团队后生效");return}
    if("pause" in button.dataset){toast(state.runPhase==="completed"?"运行记录已打开":"任务已在当前检查点暂停");return}
    if("saveExpert" in button.dataset){const name=$("#expert-name")?.value.trim()||"我的新专家",goal=$("#expert-goal")?.value.trim()||"完成指定领域的专业任务",id="custom-expert-"+Date.now();experts.push({id,name,nick:"我创建的",emoji:"✨",color:"#ef7b52",cat:"产品设计",desc:goal,skills:["机会判断","增长实验","指标设计"],assign:goal,summary:"已完成专业分析并形成可执行建议。",source:"用户自定义",version:"v1.0",tools:["联网搜索","读取文件","生成文档"],permissions:"默认只读；写入与外部动作需要确认",uses:0});state.myExpertIds.push(id);state.myTab="experts";state.view="my";render();toast("专家已创建，可加入任意专家团");return}
  });

  document.addEventListener("input",event=>{
    if(event.target.id==="task-input"){state.task=event.target.value;if(state.inputError.startsWith("请填写明确")&&event.target.value.trim()){state.inputError="";document.querySelector(".input-alert")?.remove();document.querySelector(".composer")?.classList.remove("input-error")}}
    if(event.target.id==="expert-name"&&$("#preview-name"))$("#preview-name").textContent=event.target.value;
    if(event.target.id==="expert-goal"&&$("#preview-goal"))$("#preview-goal").textContent=event.target.value;
    if(event.target.id==="team-name")state.draftTeamName=event.target.value;
  });
  document.addEventListener("keydown",event=>{if(event.target.id==="plaza-search"&&event.key==="Enter"){state.plazaSearch=event.target.value;render()}});
  render();
})();
</script>
</body>
</html>
